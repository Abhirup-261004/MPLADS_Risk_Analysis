# Render Blueprint - Express API, React-Vite Frontend, FastAPI ML Service
# Enter all sync:false values in the Render dashboard when creating or syncing.
services:
  - type: web
    name: MPLADS_Risk_Analysis
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: "production"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: CLIENT_URL
        sync: false
      - key: SEED_ADMIN_ON_START
        value: "false"
      - key: FASTAPI_ENABLED
        value: "true"
      - key: FASTAPI_URL
        sync: false
      - key: MPLADS_API_KEY
        sync: false
  - type: web
    name: MPLADS_Risk_Analysis-1
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
  - type: web
    name: mplads-ml
    runtime: docker
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MPLADS_API_KEY
        sync: false
